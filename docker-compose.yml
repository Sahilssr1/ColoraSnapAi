version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: calora_postgres
    restart: always
    environment:
      POSTGRES_USER: calora_user
      POSTGRES_PASSWORD: calora_secure_password_2026
      POSTGRES_DB: calora_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calora_user -d calora_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: calora_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calora_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://calora_user:calora_secure_password_2026@postgres:5432/calora_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_jwt_secret_calora_2026_production
      JWT_REFRESH_SECRET: super_jwt_refresh_secret_calora_2026_production
      AI_VISION_API_KEY: gemini-pro-vision-key
      OPEN_FOOD_FACTS_URL: https://world.openfoodfacts.org/api/v2/product
      USDA_API_URL: https://api.nal.usda.gov/fdc/v1
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data:
