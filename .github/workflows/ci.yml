name: Calora AI CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calora_user
          POSTGRES_PASSWORD: calora_secure_password_2026
          POSTGRES_DB: calora_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Backend Tests & Coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://calora_user:calora_secure_password_2026@localhost:5432/calora_db?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_key_ci_123456789
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_123456789
          NODE_ENV: test
        run: npm test

      - name: Build TypeScript Output
        working-directory: ./backend
        run: npm run build

  mobile-check:
    name: Mobile Typecheck & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: ./mobile
        run: npx tsc --noEmit
